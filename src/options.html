<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GIFs for GitHub - Options</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 14px;
        color: #24292f;
        max-width: 480px;
        margin: 24px auto;
        padding: 0 16px;
      }

      h2 {
        font-size: 16px;
        margin-bottom: 4px;
      }

      p {
        color: #57606a;
        margin: 0 0 12px;
        line-height: 1.5;
      }

      label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
      }

      input[type="text"] {
        width: 100%;
        padding: 6px 8px;
        font-size: 14px;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        box-sizing: border-box;
      }

      .actions {
        margin-top: 12px;
        display: flex;
        gap: 8px;
        align-items: center;
      }

      button {
        padding: 5px 16px;
        font-size: 14px;
        font-weight: 500;
        border-radius: 6px;
        border: 1px solid rgba(31, 35, 40, 0.15);
        cursor: pointer;
        background-color: #f6f8fa;
      }

      button[type="submit"] {
        background-color: #1f883d;
        color: #fff;
        border-color: rgba(31, 35, 40, 0.15);
      }

      button.danger {
        color: #cf222e;
      }

      #status {
        font-size: 12px;
        color: #57606a;
      }

      .note {
        margin-top: 24px;
        padding: 12px;
        background: #ddf4ff;
        border: 1px solid #54aeff;
        border-radius: 6px;
        color: #0550ae;
        font-size: 13px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <h2>GIPHY API Key</h2>
    <p>By default, GIFs for GitHub uses <a href="https://klipy.com" target="_blank">KLIPY</a> as its GIF provider. If you have your own GIPHY API key, you can use GIPHY instead.</p>

    <form id="options-form">
      <label for="giphy-api-key">GIPHY API Key</label>
      <input type="text" id="giphy-api-key" placeholder="Paste your GIPHY API key here" spellcheck="false" autocomplete="off" />
      <div class="actions">
        <button type="submit">Save</button>
        <button type="button" id="clear-btn" class="danger">Clear (use KLIPY)</button>
        <span id="status"></span>
      </div>
    </form>

    <div class="note">
      This is an advanced option. You can get a GIPHY API key from <a href="https://developers.giphy.com" target="_blank">developers.giphy.com</a>. Note that GIPHY may charge for API usage depending on your usage level.
    </div>

    <script src="options.js"></script>
  </body>
</html>
